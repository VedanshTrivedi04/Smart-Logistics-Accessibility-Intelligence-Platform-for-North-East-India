# Docker Compose — NER Logistics Platform (Backend + Frontend + Redis)
#
# ⚠️  PostgreSQL is hosted on Neon (serverless, Singapore region).
#     Set DATABASE_URL and DATABASE_URL_DIRECT in backend/.env
#     No local Postgres container is needed or started.

name: ner-logistics

services:
  # ─────────────────────────────────────────────────────
  # Redis — Broker + Ephemeral Result Cache
  # ─────────────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: ner_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ner_network

  # ─────────────────────────────────────────────────────
  # Backend — FastAPI Application Server
  # Connects directly to remote Neon PostgreSQL via DATABASE_URL
  # ─────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ner_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      REDIS_URL: "redis://redis:6379/0"
      REDIS_CELERY_URL: "redis://redis:6379/1"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://frontend:3000"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ner_network

  # ─────────────────────────────────────────────────────
  # Frontend — Next.js 15 Web Application
  # Internal rewrites forward /api/v1 calls to backend
  # ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ner_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: "production"
      BACKEND_ORIGIN: "http://backend:8000"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ner_network

# ─────────────────────────────────────────────────────
# Named volumes
# ─────────────────────────────────────────────────────
volumes:
  redis_data:
    driver: local

# ─────────────────────────────────────────────────────
# Isolated bridge network
# ─────────────────────────────────────────────────────
networks:
  ner_network:
    driver: bridge
