# Docker Compose — NER Logistics Platform (Full Application Stack)
#
# ⚠️  PostgreSQL is hosted on Neon (serverless).
#     Set DATABASE_URL and DATABASE_URL_DIRECT in backend/.env
#     No local Postgres container is used.
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose down               # Stop all services
#   docker compose logs -f            # Follow logs
#   docker compose up --build -d      # Rebuild and start

name: ner-logistics

services:
  # ─────────────────────────────────────────────────────
  # Redis 7 — Celery broker + ephemeral result cache
  # ─────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: ner_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ner_network

  # ─────────────────────────────────────────────────────
  # MinIO — S3-compatible private object storage
  # Media quarantine + scanned evidence storage
  # ─────────────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: ner_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ner_minio_admin       # DEV ONLY
      MINIO_ROOT_PASSWORD: ner_minio_secret  # DEV ONLY — minimum 8 chars
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console (dev only)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ner_network

  # ─────────────────────────────────────────────────────
  # MinIO bucket initializer — one-shot service
  # Creates required buckets: media-quarantine, media-clean
  # ─────────────────────────────────────────────────────
  createbuckets:
    image: quay.io/minio/mc:latest
    container_name: ner_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ner_minio_admin ner_minio_secret;
      mc mb --ignore-existing local/ner-media-quarantine;
      mc mb --ignore-existing local/ner-media-clean;
      mc anonymous set none local/ner-media-quarantine;
      mc anonymous set none local/ner-media-clean;
      echo 'Buckets initialised.';
      exit 0;
      "
    networks:
      - ner_network

  # ─────────────────────────────────────────────────────
  # Backend — FastAPI Application Server
  # Connects directly to remote Neon PostgreSQL via DATABASE_URL
  # ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ner_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Internal container service routing overrides
      REDIS_URL: "redis://redis:6379/0"
      REDIS_CELERY_URL: "redis://redis:6379/1"
      OBJECT_STORAGE_ENDPOINT: "http://minio:9000"
      ALLOWED_ORIGINS: "http://localhost:3000,http://frontend:3000"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - ner_network

  # ─────────────────────────────────────────────────────
  # Frontend — Next.js 15 Web Application
  # Internal rewrites forward /api/v1 calls to backend
  # ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ner_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"
      BACKEND_ORIGIN: "http://backend:8000"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ner_network

# ─────────────────────────────────────────────────────
# Named volumes — persistent across container restarts
# (No postgres_data — Postgres is on remote Neon)
# ─────────────────────────────────────────────────────
volumes:
  redis_data:
    driver: local
  minio_data:
    driver: local

# ─────────────────────────────────────────────────────
# Isolated bridge network
# ─────────────────────────────────────────────────────
networks:
  ner_network:
    driver: bridge
