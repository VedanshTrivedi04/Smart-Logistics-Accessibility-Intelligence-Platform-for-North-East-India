# Alembic Configuration — NER Logistics Platform
# Docs: https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Migration scripts directory
script_location = alembic

# Template for migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file_template timestamps
timezone = UTC

# Max length of slug used in filenames
truncate_slug_length = 40

# Output encoding for migration files
output_encoding = utf-8

# IMPORTANT: DATABASE_URL is loaded from environment in env.py
# The sqlalchemy.url here is overridden by env.py using DATABASE_URL_DIRECT
# (non-pooled connection required for Alembic)
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Format migration files with ruff after autogenerate
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
