[project]
name = "ner-logistics-backend"
version = "0.1.0"
description = "Smart Logistics & Accessibility Intelligence Platform for North-East India — Backend API"
authors = [{ name = "SIH 2026 Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",

    # Data validation
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",

    # Database — ORM + migrations
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "geoalchemy2==0.15.2",
    "shapely==2.0.6",

    # Background tasks
    "celery[redis]==5.4.0",
    "redis==5.2.1",

    # Object storage
    "boto3==1.35.76",

    # Structured logging
    "structlog==24.4.0",

    # HTTP client (for adapter tests + OIDC)
    "httpx==0.28.0",

    # Observability
    "prometheus-client==0.21.1",

    # Security
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.18",

    # Utilities & Dispatch Solver
    "orjson==3.10.12",
    "ortools==9.15.6755",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.28.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-passlib==1.7.7.20240819",
    "types-boto3==1.0.2",
    "sqlalchemy[mypy]==2.0.36",
    "factory-boy==3.3.1",
    "anyio[trio]==4.7.0",
    "aiosqlite==0.20.0",  # for in-memory unit tests only
]
ml = [
    # Phase 1 — feature engineering (DEM/terrain sampling, tabular data handling)
    "rasterio==1.5.1",
    "geopandas==1.1.4",
    "pandas==2.2.3",
    "numpy>=1.26,<3",
    # Phase 2+ — training/inference (installed only when actually training/serving models)
    "onnxruntime==1.30.0",
    "xgboost==3.4.1",
    "lightgbm==4.7.0",
    "scikit-learn==1.9.1",
    "shap==0.52.0",
    "ortools==9.15.6755",
    "catboost==1.2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ──────────────────────────────────────────
# Ruff configuration
# ──────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations
    "N",   # pep8-naming
    "RUF", # ruff-specific
]
ignore = [
    "ANN101", # Missing type annotation for `self`
    "ANN102", # Missing type annotation for `cls`
    "S101",   # Use of `assert` — needed for pytest
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN"]  # Relax security + annotation rules in tests

# ──────────────────────────────────────────
# Mypy configuration
# ──────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "redis.*",
    "boto3.*",
    "botocore.*",
    "geoalchemy2.*",
    "jose.*",
    "passlib.*",
    "prometheus_client.*",
    "rasterio.*",
    "catboost.*",
    "shap.*",
    "onnxruntime.*",
    "joblib.*",
    "pandas.*",
    "ortools.*",
]
ignore_missing_imports = true

# ──────────────────────────────────────────
# Pytest configuration
# ──────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
]
markers = [
    "unit: Pure unit tests with no IO",
    "integration: Tests requiring a live database or Redis",
    "contract: OpenAPI / client compatibility tests",
    "slow: Tests that take more than 5 seconds",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:sqlalchemy",
    "ignore::DeprecationWarning:starlette",
    "ignore::DeprecationWarning:fastapi",
    "ignore:.*ORJSONResponse.*",
    # shap 0.52.0's plotting submodule triggers a matplotlib colormap
    # PendingDeprecationWarning purely on import (before any plotting is
    # done) — unrelated to our own code, matplotlib-version churn. Matched by
    # message (not module) since matplotlib's warn_external() attributes the
    # warning to the caller (shap), not to matplotlib itself.
    "ignore:.*The set_(bad|over|under) function will be deprecated.*:PendingDeprecationWarning",
    # ortools' SWIG-generated pywrapcp bindings emit a handful of
    # "builtin type Swig* has no __module__ attribute" DeprecationWarnings on
    # first import. Under filterwarnings=error these get raised from inside
    # CPython's C-level type-registration code during that import, which is
    # not a safe place to raise on Windows — it manifests as a hard access
    # violation crash rather than a normal Python exception. Reproduced and
    # confirmed via a minimal pytest repro outside this project entirely.
    "ignore:.*has no __module__ attribute.*:DeprecationWarning",
    # Windows-only flake: an asyncpg/asyncio Proactor transport that a test left open is finalised by
    # the garbage collector at a random later moment, and pytest turns that (with "error") into a
    # failure of whichever unrelated test happens to be running. Matched narrowly by message so any
    # other unraisable exception still fails the suite.
    "ignore:Exception ignored in.*_ProactorBasePipeTransport.__del__.*:pytest.PytestUnraisableExceptionWarning",
]

# ──────────────────────────────────────────
# Coverage
# ──────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["app/scripts/*", "alembic/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
